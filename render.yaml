services:
  # -------------------------------------------------------------
  # 1. Backend REST API (Node.js & Express.js)
  # -------------------------------------------------------------
  - type: web
    name: college-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: USE_FAKE_DB
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        value: "*"
    healthCheckPath: /health

  # -------------------------------------------------------------
  # 2. Frontend Web Client (Flutter Web as a Render Static Site)
  # -------------------------------------------------------------
  - type: static
    name: college-web
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: |
      if [ ! -d "$HOME/flutter" ]; then
        git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
      fi
      export PATH="$PATH:$HOME/flutter/bin"
      flutter doctor -v
      flutter config --enable-web
      flutter pub get
      flutter build web --release
    publishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

